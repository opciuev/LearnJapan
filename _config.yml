# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing these this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: 标日学习日志
sidebartitle: 标日学习
email: 
description: 标准日本语学习日志 - Fork from https://github.com/wizicer/LearnJapan
baseurl: "" # the subpath of your site, e.g. /blog
url: "http://localhost:4000" # the base hostname & protocol for your site

# User settings
username: 
user_description: Fork from https://github.com/wizicer/LearnJapan
twitter_username: 
github_username: 
# gplus_username:  lorem_ipsum
# disqus_username: lorem_ipsum

# Build settings
markdown: kramdown
highlighter: rouge
permalink: none

plugins:
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-sitemap

# html minify
compress_html:
  clippings: all
  comments: all
  endings: []
  profile: false

# Links to include in menu navigation
# For external links add external: true
links:
  - title: 语法
    url: /tools/grammar.html
  - title: 表达及词语讲解
    url: /tools/expressions.html
  - title: 单词
    url: /tools/wordlist.html
  # - title: Series
  #   url: /series
  # - title: Tags
  #   url: /tags
  - title: 关于
    url: /about/index.html

# exclude my node related stuff
exclude: ['package.json', 'src', 'node_modules', 'site.vfs', 'Gemfile.lock', 'Gemfile', 'CNAME', 'LICENSE', '*.bat', 'gulpfile.js', 'ionic']

la51_analytics: 

categorythemes:
  grammar:
    name: 语法
    tag: grammar
    theme: red
  word:
    name: 单词
    tag: word
    theme: purple
  class:
    name: 初级课文
    tag: class
    theme: orange
  notebook:
    name: 笔记
    tag: notebook
  middleclass:
    name: 中级课文
    tag: middleclass
  tools:
    name: 工具
    tag: tools
