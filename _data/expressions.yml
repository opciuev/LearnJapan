- idx: 27
  lesson: '004'
  expression: '"J R" 和 "地下鉄"'
  shortexplain: '日本铁路系统的简称'
  explanation: |
    "J R" 原本是国营的，叫做"国铁（こくてつ）"，是"日本国有鉄道"的简称，1987年民营化后，改为现在的名称。"J R"是"Japan Railways"的简称。
    
    人们出远门时，经常利用新干线等"JR"的列车，近距离移动时除"JR"之外，也常利用别的"私鉄（しだてつ）"。在札幌、仙台、东京、横滨、大阪、名古屋、福冈等大城市圈都有地铁运行。
  examples:
  - japanese: 'JR{ジェイアール}の 列車{れっしゃ}は 準確{じんくわ}に 運行{うんこう}します。'
    chinese: 'JR的列车准时运行。'
    type: sentence
  - japanese: '東京{とうきょう}には 地下鉄{ちかてつ}があります。'
    chinese: '东京有地铁。'
    type: sentence

